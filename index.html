<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>React State Lab</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./styles.css" />

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "htm": "https://esm.sh/htm@3.1.1",
    "zustand": "https://esm.sh/zustand@5.0.3?external=react",
    "zustand/react/shallow": "https://esm.sh/zustand@5.0.3/react/shallow?external=react",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@5.62.7?external=react",
    "@babel/standalone": "https://esm.sh/@babel/standalone@7.26.4"
  }
}
</script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">

<div id="root">
  <div class="flex h-full flex-col items-center justify-center gap-3 text-slate-400 dark:text-slate-500">
    <div class="text-xs uppercase tracking-[0.2em]">Loading the lab</div>
    <div class="h-1 w-44 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800">
      <div class="boot-bar h-full w-1/3 rounded-full bg-blue-600"></div>
    </div>
  </div>
</div>

<div id="fatal" hidden class="mx-auto max-w-2xl p-8 font-mono text-[13px] leading-relaxed text-red-600 dark:text-red-400"></div>

<script>
  /* Classic script on purpose: it still runs in a browser that refuses to
     execute module scripts at all, which is how a file:// open usually fails. */
  var HOW_TO_SERVE =
    'This version is split into ES modules, so it must be served over http —\n' +
    'opening the file directly will not work. From this folder run:\n\n' +
    '    npx serve .            (or)   python -m http.server 8000\n\n' +
    'then open the URL it prints. React and the other libraries load from esm.sh,\n' +
    'so the first load also needs a network connection.';

  window.__labFatal = function (title, detail) {
    var root = document.getElementById('root');
    var fatal = document.getElementById('fatal');
    if (root) root.innerHTML = '';
    fatal.hidden = false;
    fatal.style.whiteSpace = 'pre-wrap';
    fatal.textContent = title + '\n\n' + detail;
  };

  window.__labBootTimer = setTimeout(function () {
    if (window.__lab) return;
    if (!document.getElementById('fatal').hidden) return;
    window.__labFatal('The lab did not start within 12 seconds.', HOW_TO_SERVE);
  }, 12000);
</script>

<script type="module" src="./js/boot.js"></script>

</body>
</html>
