<script id="app-src" type="text/plain">
/* ============================================================================
   OCR STATE LAB
   A single-file drill rig for React state management.
   Everything below runs inside new Function(...) with these already in scope:
   React, ReactDOM, create (zustand), useShallow, RQ (@tanstack/react-query), Babel
   ========================================================================== */

const { useState, useEffect, useRef, useMemo, useCallback, useContext,
        useReducer, useLayoutEffect, useSyncExternalStore, createContext, memo } = React;
const { useQuery, useMutation, useQueryClient, useQueries, QueryClient,
        QueryClientProvider, keepPreviousData } = RQ;

/* ---------------------------------------------------------------------------
   1. MOCK API — setTimeout only, no network. Fails on purpose sometimes.
   ------------------------------------------------------------------------- */

const FILE_NAMES = [
  'invoice-4417.pdf', 'contract-acme-v3.pdf', 'receipt-scan-0091.jpg',
  'passport-page1.png', 'shipping-manifest.tiff', 'lab-results-88.pdf',
  'w9-form-signed.pdf', 'delivery-note-2210.jpg'
];
const STATUSES = ['queued', 'processing', 'done', 'failed'];

let JOB_SEQ = 1000;
function makeJob(over) {
  const id = 'job_' + (++JOB_SEQ);
  const base = {
    id,
    file: FILE_NAMES[Math.floor(Math.random() * FILE_NAMES.length)],
    status: 'queued',
    pages: 1 + Math.floor(Math.random() * 24),
    confidence: null,
    progress: 0,
    createdAt: Date.now()
  };
  return Object.assign(base, over || {});
}

const apiConfig = { failureRate: 0.2, forceFailNext: false, latency: [380, 900] };

/* Two call-rate tripwires.
   Burst: a tight loop hammering the API — halt before the tab freezes.
   Runaway: the same request repeating forever at a human-visible pace, which is
   what an effect with no dependency array actually looks like. Legitimate
   polling runs at 1500ms (13 calls / 20s), so 20 leaves room. */
const callTimes = [];
const labelTimes = {};

function recordCall(label) {
  const now = Date.now();
  callTimes.push(now);
  while (callTimes.length && now - callTimes[0] > 2000) callTimes.shift();

  const seen = labelTimes[label] || (labelTimes[label] = []);
  seen.push(now);
  while (seen.length && now - seen[0] > 20000) seen.shift();

  return { burst: callTimes.length, repeats: seen.length };
}

function resetCallCounters() {
  callTimes.length = 0;
  Object.keys(labelTimes).forEach(function (k) { delete labelTimes[k]; });
}

/* Handed back when a tripwire fires: settles never, so the loop stops dead
   without throwing an error nobody asked for. */
const NEVER = new Promise(function () {});

function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function rand(a, b) { return a + Math.random() * (b - a); }

function shouldFail() {
  if (apiConfig.forceFailNext) { apiConfig.forceFailNext = false; return true; }
  return Math.random() < apiConfig.failureRate;
}

function apiCall(label, work, opts) {
  const options = opts || {};
  const rate = recordCall(label);
  if (rate.burst > 40) {
    Runtime.halt('Request storm: ' + rate.burst + ' API calls in 2 seconds.\nSomething is fetching on every render. Check the dependency array — and remember that an object or array literal in the deps is a new reference every time.');
    return NEVER;
  }
  if (rate.repeats > 20) {
    Runtime.halt('Runaway effect: "' + label + '" has now run ' + rate.repeats + ' times and shows no sign of stopping.\nThis is what useEffect with no dependency array does — fetch, setState, re-render, fetch again, forever.\nAdd the second argument: }, []).');
    return NEVER;
  }
  Runtime.log('api', label + ' →');
  return delay(rand(apiConfig.latency[0], apiConfig.latency[1])).then(function () {
    if (!options.neverFails && shouldFail()) {
      Runtime.log('fail', label + ' ✗ 503 extraction service unavailable');
      throw new Error('503 — extraction service unavailable. Try again.');
    }
    const out = work();
    Runtime.log('ok', label + ' ✓');
    return out;
  });
}

let DB = [];
function seedDB() {
  JOB_SEQ = 1000;
  DB = [
    makeJob({ file: 'invoice-4417.pdf',        status: 'done',       pages: 3,  confidence: 0.97, progress: 100 }),
    makeJob({ file: 'contract-acme-v3.pdf',    status: 'processing', pages: 18, confidence: null, progress: 40 }),
    makeJob({ file: 'receipt-scan-0091.jpg',   status: 'failed',     pages: 1,  confidence: null, progress: 0 }),
    makeJob({ file: 'shipping-manifest.tiff',  status: 'queued',     pages: 7,  confidence: null, progress: 0 }),
    makeJob({ file: 'w9-form-signed.pdf',      status: 'done',       pages: 2,  confidence: 0.88, progress: 100 })
  ];
}
seedDB();

const mockApi = {
  /* Returns the current job list. */
  listJobs: function () {
    return apiCall('listJobs', function () { return DB.map(function (j) { return Object.assign({}, j); }); });
  },
  /* One job by id. Advances a processing job a little on every read, so
     polling exercises actually converge on "done". */
  getJob: function (id) {
    return apiCall('getJob ' + id, function () {
      const job = DB.find(function (j) { return j.id === id; });
      if (!job) throw new Error('404 — no job with id ' + id);
      if (job.status === 'processing' || job.status === 'queued') {
        job.status = 'processing';
        job.progress = Math.min(100, job.progress + 22 + Math.floor(Math.random() * 12));
        if (job.progress >= 100) {
          job.status = 'done';
          job.confidence = Math.round(rand(0.82, 0.99) * 100) / 100;
        }
      }
      return Object.assign({}, job);
    }, { neverFails: true });
  },
  /* Upload: takes { file }, returns the created job. Can fail. */
  uploadDocument: function (input) {
    const name = (input && input.file) || 'untitled.pdf';
    return apiCall('uploadDocument ' + name, function () {
      const job = makeJob({ file: name, status: 'processing', progress: 8 });
      DB = [job].concat(DB);
      return Object.assign({}, job);
    });
  },
  /* Re-queue a failed job. */
  retryJob: function (id) {
    return apiCall('retryJob ' + id, function () {
      const job = DB.find(function (j) { return j.id === id; });
      if (!job) throw new Error('404 — no job with id ' + id);
      job.status = 'processing'; job.progress = 5; job.confidence = null;
      return Object.assign({}, job);
    });
  },
  /* Starts a fresh long job that needs ~5 polls to finish. */
  startExtraction: function (name) {
    return apiCall('startExtraction', function () {
      const job = makeJob({ file: name || 'contract-acme-v3.pdf', status: 'processing', progress: 0 });
      DB = [job].concat(DB);
      return Object.assign({}, job);
    }, { neverFails: true });
  },
  reset: function () { seedDB(); }
};

/* ---------------------------------------------------------------------------
   2. RUNTIME — sandbox log + halt signal, readable from outside React.
   ------------------------------------------------------------------------- */

const Runtime = (function () {
  let lines = [];
  let halted = null;
  let version = 0;
  const listeners = new Set();
  function emit() { version++; listeners.forEach(function (l) { l(); }); }
  return {
    subscribe: function (l) { listeners.add(l); return function () { listeners.delete(l); }; },
    getSnapshot: function () { return version; },
    get lines() { return lines; },
    get halted() { return halted; },
    log: function (kind, text) {
      const t = new Date();
      const stamp = String(t.getMinutes()).padStart(2, '0') + ':' +
                    String(t.getSeconds()).padStart(2, '0') + '.' +
                    String(t.getMilliseconds()).padStart(3, '0');
      lines = lines.concat([{ kind: kind, text: text, stamp: stamp, id: Math.random() }]).slice(-120);
      emit();
    },
    halt: function (reason) { if (!halted) { halted = reason; emit(); } },
    clear: function () {
      lines = []; halted = null;
      resetCallCounters();
      setterTimes.length = 0;
      hookCallTimes.length = 0;
      emit();
    }
  };
})();

/* Setter-rate tripwire, for loops that never touch the API. */
const setterTimes = [];
function guardSetter() {
  const now = Date.now();
  setterTimes.push(now);
  while (setterTimes.length && now - setterTimes[0] > 2000) setterTimes.shift();
  if (setterTimes.length > 500) {
    Runtime.halt('Render loop: 500+ state updates in 2 seconds.\nSomething sets state on every render. Usually a useEffect missing its dependency array, or an effect that sets state it also depends on.');
    return false;
  }
  return !Runtime.halted;
}

/* Store-subscription tripwire. A zustand selector that returns a fresh object
   fails Object.is on every check, and useSyncExternalStore re-renders forever.
   Lesson 05-C ships that bug on purpose, so catch it and name it. */
const hookCallTimes = [];
function guardStoreHook() {
  const now = Date.now();
  hookCallTimes.push(now);
  while (hookCallTimes.length && now - hookCallTimes[0] > 2000) hookCallTimes.shift();
  if (hookCallTimes.length > 600) {
    Runtime.halt('Subscription loop: 600+ store reads in 2 seconds.\nA selector that builds a new object or array every call never passes the Object.is check, so the component re-renders, re-selects, and starts again.\nSelect primitives separately, or wrap the selector in useShallow(...).');
    return false;
  }
  return !Runtime.halted;
}

/* create(), wrapped so the returned hook is rate-limited. getState/setState/
   subscribe are copied across so the store API is unchanged. */
function createGuarded(initializer) {
  const useStore = create(initializer);
  function useGuardedStore(selector) {
    if (!guardStoreHook()) {
      throw new Error('Preview halted — see the note above the preview.');
    }
    return arguments.length === 0 ? useStore() : useStore(selector);
  }
  Object.assign(useGuardedStore, useStore);
  return useGuardedStore;
}

/* ---------------------------------------------------------------------------
   3. SANDBOX SCOPE — what the learner's code can reach.
   ------------------------------------------------------------------------- */

/* Instrumented useState: identical API, plus loop protection. */
function useStateGuarded(initial) {
  const pair = React.useState(initial);
  const set = pair[1];
  const wrapped = React.useCallback(function () {
    if (!guardSetter()) return;
    return set.apply(null, arguments);
  }, [set]);
  return [pair[0], wrapped];
}

/* Counts renders without causing any. This is the whole point of lessons 4 and 5. */
function useRenderCount() {
  const n = React.useRef(0);
  n.current++;
  return n.current;
}

function RenderBadge(props) {
  const n = props.count;
  const hot = n > 6;
  return (
    <span
      data-renders={n}
      title="How many times this component has re-rendered since the last Run"
      className={'ml-2 inline-flex items-center gap-1 rounded px-1.5 py-0.5 font-mono text-[10px] font-medium ' +
      (hot ? 'bg-fail/15 text-fail ring-1 ring-fail/30' : 'bg-rule/60 text-graphite ring-1 ring-rule')}>
      <span className={hot ? 'blip' : ''}>●</span>{'renders ' + n}
    </span>
  );
}

function Spinner(props) {
  return (
    <svg className={'animate-spin ' + (props.className || 'h-4 w-4 text-lamp')} viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle className="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" />
      <path className="opacity-90" fill="currentColor" d="M12 2a10 10 0 0 1 10 10h-3a7 7 0 0 0-7-7V2z" />
    </svg>
  );
}

/* Small presentational helpers so exercise code stays about state, not markup. */
const STATUS_TONE = {
  done:       'text-ok ring-ok/30 bg-ok/10',
  processing: 'text-lamp ring-lamp/30 bg-lamp/10',
  queued:     'text-wait ring-wait/30 bg-wait/10',
  failed:     'text-fail ring-fail/30 bg-fail/10'
};

function StatusPill(props) {
  const tone = STATUS_TONE[props.status] || 'text-graphite ring-rule bg-rule/40';
  return (
    <span className={'inline-flex items-center gap-1.5 rounded-full px-2 py-0.5 font-mono text-[10px] uppercase tracking-wider ring-1 ' + tone}>
      <span className={props.status === 'processing' ? 'blip' : ''}>●</span>{props.status}
    </span>
  );
}

function JobRow(props) {
  const job = props.job;
  return (
    <button
      type="button"
      onClick={props.onClick}
      className={'flex w-full items-center gap-3 rounded-md border px-3 py-2 text-left transition-colors ' +
        (props.selected ? 'border-lamp/50 bg-lamp/[0.07]' : 'border-rule bg-bed2 hover:border-rule hover:bg-rule/40')}
    >
      <span className="min-w-0 flex-1">
        <span className="block truncate text-[13px] text-paper">{job.file}</span>
        <span className="block font-mono text-[10px] text-graphite">{job.id + ' · ' + job.pages + ' pages'}</span>
      </span>
      <StatusPill status={job.status} />
    </button>
  );
}

function Panel(props) {
  return (
    <div className="rounded-lg border border-rule bg-bed2 p-3">
      <div className="mb-2 flex items-center font-mono text-[10px] uppercase tracking-[0.18em] text-graphite">
        {props.title}
        {typeof props.count === 'number' ? <RenderBadge count={props.count} /> : null}
      </div>
      {props.children}
    </div>
  );
}

const SANDBOX = {
  React: React,
  useState: useStateGuarded,
  useEffect: React.useEffect,
  useLayoutEffect: React.useLayoutEffect,
  useRef: React.useRef,
  useMemo: React.useMemo,
  useCallback: React.useCallback,
  useContext: React.useContext,
  useReducer: React.useReducer,
  useSyncExternalStore: React.useSyncExternalStore,
  createContext: React.createContext,
  memo: React.memo,
  Fragment: React.Fragment,

  create: createGuarded,
  useShallow: useShallow,

  useQuery: RQ.useQuery,
  useMutation: RQ.useMutation,
  useQueryClient: RQ.useQueryClient,
  useQueries: RQ.useQueries,
  QueryClient: RQ.QueryClient,
  QueryClientProvider: RQ.QueryClientProvider,
  keepPreviousData: RQ.keepPreviousData,

  mockApi: mockApi,
  useRenderCount: useRenderCount,
  RenderBadge: RenderBadge,
  StatusPill: StatusPill,
  JobRow: JobRow,
  Panel: Panel,
  Spinner: Spinner,
  log: function (msg) { Runtime.log('user', String(msg)); }
};

const SANDBOX_NAMES = Object.keys(SANDBOX);
const SANDBOX_VALUES = SANDBOX_NAMES.map(function (k) { return SANDBOX[k]; });

/* Compile learner source into a component. Throws with a readable message. */
function compile(source) {
  let transpiled;
  try {
    transpiled = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]],
      filename: 'exercise.jsx'
    }).code;
  } catch (err) {
    const e = new Error('Syntax error — ' + err.message.split('\n')[0]);
    e.phase = 'compile';
    e.detail = err.message;
    throw e;
  }
  const body = '"use strict";\n' + transpiled +
    '\n;return (typeof App !== "undefined") ? App : null;';
  let factory;
  try {
    factory = new Function(SANDBOX_NAMES.join(','), body);
  } catch (err) {
    const e = new Error('Could not build your code — ' + err.message);
    e.phase = 'compile';
    throw e;
  }
  const Component = factory.apply(null, SANDBOX_VALUES);
  if (typeof Component !== 'function') {
    const e = new Error('No component named App was found. Your code must define a component called App — that is what gets rendered.');
    e.phase = 'compile';
    throw e;
  }
  return Component;
}

/* Strip comments before running checks, so a TODO comment mentioning useState
   never counts as an answer. */
function stripComments(src) {
  return src
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/(^|[^:"'`\\])\/\/[^\n]*/g, '$1 ');
}

function runChecks(exercise, source, renderOk) {
  const clean = stripComments(source);
  const list = (exercise.checks || []).map(function (c) {
    let passed = false;
    try { passed = !!c.test(clean, source); } catch (e) { passed = false; }
    return { label: c.label, hint: c.hint, passed: passed };
  });
  list.unshift({
    label: 'Renders without crashing',
    hint: 'Read the error under the preview — it names the line. A blank preview usually means App returned nothing.',
    passed: !!renderOk
  });
  return list;
}

/* ---------------------------------------------------------------------------
   3b. THE EDITOR BRAIN
   Monaco is the editor VS Code is built on. Loading it is optional: if the CDN
   or the network is not there, the lab falls back to the plain editor and
   everything else keeps working.
   ------------------------------------------------------------------------- */

const MONACO_CDN = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs';

/* Ambient declarations for everything the sandbox puts in scope. This is what
   turns "a textarea" into autocomplete, hover docs and signature help. */
const SANDBOX_TYPES = [
  'declare namespace JSX { interface IntrinsicElements { [tag: string]: any } }',
  '',
  '/** One OCR extraction job. */',
  'interface OcrJob {',
  '  /** Job id, e.g. "job_1002". */',
  '  id: string;',
  '  /** Original filename, e.g. "invoice-4417.pdf". */',
  '  file: string;',
  '  /** queued -> processing -> done, or failed. */',
  '  status: "queued" | "processing" | "done" | "failed";',
  '  /** Page count of the document. */',
  '  pages: number;',
  '  /** Extraction progress, 0-100. */',
  '  progress: number;',
  '  /** OCR confidence 0-1. Null until the job is done. */',
  '  confidence: number | null;',
  '  createdAt: number;',
  '}',
  '',
  '/** The fake backend. setTimeout only - there is no network. */',
  'declare const mockApi: {',
  '  /** Every job in the queue. Rejects about 20% of the time with a 503. */',
  '  listJobs(): Promise<OcrJob[]>;',
  '  /** One job by id. Each read advances a processing job ~25%, so polling converges on "done". Never fails. */',
  '  getJob(id: string): Promise<OcrJob>;',
  '  /** Uploads a document and returns the created job. Rejects about 20% of the time. */',
  '  uploadDocument(input: { file: string }): Promise<OcrJob>;',
  '  /** Re-queues a failed job. Rejects about 20% of the time. */',
  '  retryJob(id: string): Promise<OcrJob>;',
  '  /** Starts a fresh long job that needs 4-5 polls to finish. Never fails. */',
  '  startExtraction(name?: string): Promise<OcrJob>;',
  '  /** Restores the seed data. */',
  '  reset(): void;',
  '};',
  '',
  '/** Writes a line to the sandbox log under the preview. Survives unmount, which is how you see a leaked timer. */',
  'declare function log(message: any): void;',
  '',
  '/** Returns how many times this component has rendered. Uses a ref, so it never causes a render itself. */',
  'declare function useRenderCount(): number;',
  '',
  '// ---- React -------------------------------------------------------------',
  '',
  '/** State that survives re-renders. Use the updater form when the next value depends on the previous one. */',

let monacoPromise = null;
const monacoState = { status: 'loading', listeners: new Set() };

function setMonacoStatus(next) {
  if (monacoState.status === next) return;
  monacoState.status = next;
  monacoState.listeners.forEach(function (fn) { fn(); });
}

function loadMonaco() {
  if (monacoPromise) return monacoPromise;

  monacoPromise = new Promise(function (resolve, reject) {
    if (window.monaco && window.monaco.editor) return resolve(window.monaco);

    const script = document.createElement('script');
    script.src = MONACO_CDN + '/loader.js';
    script.async = true;

    script.onload = function () {
      try {
        /* Workers cannot be created from another origin, so wrap the CDN worker
           in a same-origin blob that importScripts it. */
        window.MonacoEnvironment = {
          getWorkerUrl: function () {
            const shim = 'self.MonacoEnvironment = { baseUrl: "' + MONACO_CDN + '/" };\n' +
                         'importScripts("' + MONACO_CDN + '/base/worker/workerMain.js");';
            return URL.createObjectURL(new Blob([shim], { type: 'text/javascript' }));
          }
        };
        window.require.config({ paths: { vs: MONACO_CDN } });
        window.require(['vs/editor/editor.main'], function () {
          try { configureMonaco(window.monaco); resolve(window.monaco); }
          catch (err) { reject(err); }
        }, reject);
      } catch (err) { reject(err); }
    };

    script.onerror = function () { reject(new Error('Could not reach the Monaco CDN')); };
    document.head.appendChild(script);

    window.setTimeout(function () { reject(new Error('Monaco timed out')); }, 20000);
  });

  monacoPromise
    .then(function () { setMonacoStatus('ready'); })
    .catch(function (err) {
      Runtime.log('fail', 'code editor: ' + err.message + ' — using the plain editor');
      setMonacoStatus('plain');
    });

  return monacoPromise;
}

      <p>
        State is a <em>snapshot</em>, not a variable. Every render gets its own frozen copy of
        every value it read, and calling a setter does not change that copy — it schedules
        another render with a new one. That single fact explains most useState bugs.
      </p>
      <p>
        There are two ways to update. <K>setJobs(next)</K> uses the value this render closed over.
        <K>setJobs(prev =&gt; next)</K> asks React for the latest queued value instead. Whenever the new
        value depends on the old one — counters, toggles, appending to a list, anything inside a
        loop, timer, or async callback — use the function form. The direct form reads a value that
        may already be stale.

      checks: [
        { label: 'retryAll uses a functional update',
          test: function (s) { return /setRetried\s*\(\s*\(?\s*\w+\s*\)?\s*=>/.test(s); },
          hint: 'setRetried(r => r + 1). Inside the forEach, "retried" is the same captured number three times, so three calls all set it to 1.' },
        { label: 'retryLater uses a functional update',

LESSONS.push({
  n: '02',
  id: 'useeffect',
  title: 'useEffect',
  subtitle: 'Fetch, cleanup, dependencies',
  concept: (
    <div className="prose-lesson">
      <p>
        An effect synchronizes your component with something outside React — a server, a timer, a
        subscription, the DOM. It runs after the browser paints, and the dependency array decides
        when it runs again.
      </p>
      <p>
        <K>useEffect(fn)</K> with no array runs after <em>every</em> render. Fetch inside it, set
        state, and you have an infinite loop. <K>useEffect(fn, [])</K> runs once after mount.
        <K>useEffect(fn, [jobId])</K> re-runs whenever <K>jobId</K> changes. Deps are compared with
        <K>Object.is</K>, so an object or array literal in the list is a new reference each render
        and the effect never stops re-running.
      </p>
      <p>
        Return a cleanup function. React runs it before the next run of the effect and once on
        unmount — clear the interval, unsubscribe, ignore the in-flight response. Without it you
        leak timers and race two responses against each other.
      </p>
      <p>
        And the modern instinct: if you are only transforming data for display, you don't need an
        effect at all. Compute it during render.
      </p>
    </div>
  ),
  interview: 'The dependency array is not a performance knob, it is a correctness contract: it says what the effect reads from the render. Missing array means it runs every render, empty array means once on mount, and I always return a cleanup so an unmounted component cannot clear a timer late or apply a stale response.',

LESSONS.push({

  id: 'useref',
  title: 'useRef',
  subtitle: 'Focus, timer handles, previous values',
  concept: (
    <div className="prose-lesson">
      <p>
        <K>useRef</K> gives you one mutable box, <K>{'{ current }'}</K>, that survives every render
        and <strong>never triggers one</strong>. That last part is the whole reason it exists.
      </p>
      <p>
        Two jobs. First, DOM handles: put <K>ref={'{inputRef}'}</K> on an element and React fills
        <K>inputRef.current</K> with the node, so you can call <K>.focus()</K> or <K>.scrollIntoView()</K>.
        Second, instance values the UI does not display: a <K>setInterval</K> id you need in order to
        clear it, a "has this already run" flag, the previous value of a prop.
      </p>
      <p>
        Choose by asking one question: does the screen change when this value changes? If yes, it is
        state. If no, it is a ref. Storing a timer id in state re-renders the component on every
        poll tick for nothing.
      </p>
      <p>
        The rule that follows: don't read a ref during render to decide what to draw. React never
        re-renders when <K>.current</K> changes, so the screen would show a value from a previous
        render and never correct itself.
      </p>
    </div>
  ),
  interview: 'A ref is for values the render output does not depend on — DOM nodes, timer handles, the previous value — because writing to .current never schedules a render. If the UI has to change when the value changes, that is state, not a ref.',

  concept: (
    <div className="prose-lesson">
      <p>
        Context moves a value down the tree without threading it through props.
        <K>createContext(default)</K> makes the channel, <K>{'<Ctx.Provider value={x}>'}</K> publishes
        on it, <K>useContext(Ctx)</K> reads it from any depth. It exists to kill prop drilling —
        that is all it promises.
      </p>
      <p>
        Here is the tax. Every component that calls <K>useContext(Ctx)</K> re-renders whenever the
        provider's <K>value</K> changes identity — <em>not</em> when the part it actually uses changes.
        Pass <K>value={'{{ user, throughput }}'}</K> and you create a brand-new object on every provider
        render, so all consumers re-render even if <K>user</K> never moved.
      </p>
      <p>
        And <K>React.memo</K> does not save you. Memo compares props; context bypasses props entirely.
        A memoized consumer still re-renders on every context change.
      </p>
      <p>
        Three fixes, in order of value: split one context into several by how often each value
        changes, wrap stable values in <K>useMemo</K> so their identity holds, and put the
        fast-changing provider as low in the tree as it will go.
      </p>
    </div>
  ),

      <p>
        Zustand keeps the store <em>outside</em> React. <K>create((set, get) =&gt; ({'{...}'}))</K> returns a
        hook, and there is no provider to mount — which is exactly why it does not have context's
        problem.
      </p>
      <p>
        Components subscribe with a selector: <K>useStore(s =&gt; s.filter)</K>. The store compares the
        selected slice with <K>Object.is</K> after every update and re-renders only the components
        whose slice actually changed. A throughput value ticking four times a second wakes the one
        component that selected it, and nothing else.
      </p>
      <p>
        <K>set</K> shallow-merges the top level and takes a function when the next value depends on
        the current one, same as <K>useState</K>. <K>get()</K> reads the current state inside actions.
        Actions live in the store, so components stay dumb.
      </p>
      <p>
        The one trap: a selector that builds a new object — <K>s =&gt; ({'{ a: s.a, b: s.b }'})</K> — fails
        <K>Object.is</K> every single time. Select the fields separately, or wrap it in
        <K>useShallow</K>.
      </p>

      <p>

        objects called actions. A reducer — <K>(state, action) =&gt; newState</K> — is a pure function
        that decides what the next tree looks like. Nothing else may write.
      </p>
      <p>

        whole app's state is inspectable and time-travellable in DevTools; and the update logic is
        pure functions you can unit test without React.
      </p>
      <p>
        It cost a lot of boilerplate, which is why Redux Toolkit exists and is now the only
        recommended way to write Redux. And most of what teams used Redux for in 2018 was caching

        to say when you would still reach for it.
      </p>
    </div>

  interview: 'Redux gives you one auditable, time-travellable state tree with pure reducers, which is worth the ceremony when a lot of client state is shared across a large app and many teams. If the state I am reaching for is really a cache of server responses, I use React Query instead — that was most of what Redux got used for.',

          "const JOB_RETRIED = 'jobs/retried';",
          "",
          "const jobRetried = (id) => ({ type: JOB_RETRIED, payload: id });",

          "  name: 'jobs',",
          "  initialState: { items: [] },",
          "  reducers: {",
          "    // Immer makes this 'mutation' produce a new immutable state.",

          <li><span className="text-paper">createSlice</span> generates action types and creators from the reducer names — the three-file dance is gone.</li>
          <li><span className="text-paper">Immer</span> lets you write mutating syntax and still get immutable updates.</li>
          <li><span className="text-paper">configureStore</span> ships with thunk middleware, DevTools, and dev-time mutation checks already on.</li>
          <li><span className="text-paper">createAsyncThunk</span> handles pending/fulfilled/rejected; <span className="text-paper">RTK Query</span> is their answer to React Query if you are already all-in on Redux.</li>

      </section>

      <section className="grid gap-3 md:grid-cols-2">
        <div className="rounded-lg border border-ok/30 bg-ok/[0.05] p-4">
          <h4 className="mb-2 font-mono text-[10px] uppercase tracking-[0.18em] text-ok">Genuinely the right call</h4>
          <ul className="space-y-1.5 text-[13px] text-paper/85">

            <li>Complex <em>client</em> state with real interdependencies — a multi-step review workflow, an editor with undo/redo.</li>
            <li>You need the audit trail: every change is a named event you can log, replay, or time-travel in DevTools.</li>
            <li>Update logic worth unit testing on its own, away from components.</li>
            <li>Middleware belongs in the pipeline: analytics on every action, optimistic queues, offline sync.</li>
          </ul>
        </div>
        <div className="rounded-lg border border-fail/30 bg-fail/[0.05] p-4">
          <h4 className="mb-2 font-mono text-[10px] uppercase tracking-[0.18em] text-fail">Overkill</h4>
          <ul className="space-y-1.5 text-[13px] text-paper/85">
            <li>The state is really a cache of server responses. That is React Query's job — keys, staleness, refetching, dedupe.</li>
            <li>A handful of UI flags: modal open, selected row, filter text. <K>useState</K>, or zustand once it is shared.</li>
            <li>You only wanted to avoid prop drilling. That is context.</li>
            <li>Small team, small app — the ceremony costs more than the discipline returns.</li>
          </ul>
        </div>
      </section>

      <section className="rounded-lg border border-rule bg-bed2 p-4">
        <h4 className="mb-2 font-mono text-[10px] uppercase tracking-[0.18em] text-graphite">If they ask you to compare</h4>
        <div className="space-y-2 text-[13px] text-paper/85">
          <p><span className="text-lamp">Context</span> — dependency injection. No re-render control: every consumer wakes when the provider value changes identity.</p>
          <p><span className="text-lamp">Zustand</span> — a store outside React with per-selector subscriptions. Minimal ceremony, no provider, easy to over-use as a dumping ground.</p>
          <p><span className="text-lamp">Redux Toolkit</span> — the same store idea plus enforced conventions, DevTools, and middleware. You pay in ceremony and buy traceability.</p>
          <p><span className="text-lamp">React Query</span> — not a competitor to any of them. It owns server state; the others own client state.</p>
        </div>
      </section>
    </div>
  )

    <div className="prose-lesson">
      <p>
        React Query manages <em>server state</em> — data you do not own, that goes stale on its own,
        and that several components need at once. <K>{"useQuery({ queryKey, queryFn })"}</K> gives you a
        cache entry plus loading, error, refetch, dedupe, and retry for free.
      </p>
      <p>
        The <K>queryKey</K> is the cache identity. <K>['jobs']</K> and <K>['job', id]</K> are separate
        entries; change the key and you get a different one. Keys are also the handle you invalidate
        by.
      </p>
      <p>
        Mutations do not update the cache. <K>{"useMutation({ mutationFn })"}</K> sends the write, then
        in <K>onSuccess</K> you call <K>{"queryClient.invalidateQueries({ queryKey: ['jobs'] })"}</K> and the
        affected queries refetch themselves.
      </p>
      <p>
        v5 vocabulary, which interviewers do check: <K>isPending</K> means no data yet,
        <K>isFetching</K> means a request is in flight (including background refetches),
        <K>isLoading</K> is both at once. <K>gcTime</K> replaced <K>cacheTime</K>, and
        <K>placeholderData: keepPreviousData</K> replaced <K>keepPreviousData: true</K>. Polling is
        <K>refetchInterval</K>, which can be a function so it can turn itself off.
      </p>
    </div>

/* ---- Error boundary around learner code --------------------------------- */

/* React's runtime messages are precise and unhelpful. Translate the ones this
   course actually provokes into something you can act on. */
const ERROR_COACHING = [
  { re: /Maximum update depth exceeded/,
    say: 'A component is setting state in a loop. Two usual suspects: a useEffect that sets state it also depends on (check the dependency array), or a store selector that builds a new object or array on every call — that fails the Object.is check, so it re-renders, re-selects, and starts again. Fix the selector with useShallow, or select one primitive at a time.' },
  { re: /Rendered (more|fewer) hooks|order of Hooks|Rendered more hooks than during the previous render/,
    say: 'Hooks must run in the same order on every render. One of yours is inside an if, a loop, or after an early return — move it to the top of the component.' },
  { re: /Cannot read propert(y|ies) of (undefined|null)|Cannot destructure/,
    say: 'You read from something that is not there yet. With server data that usually means the component rendered before the request resolved — handle the pending state first, or give the value a default.' },
  { re: /is not a function/,
    say: 'Check the spelling and that it is in scope. This sandbox provides the hooks, create, useShallow, the React Query hooks, mockApi, log, and the display helpers — anything else you have to define in this file.' },
  { re: /Objects are not valid as a React child/,
    say: 'You rendered an object directly. Pick a field out of it, or wrap it in JSON.stringify while you are debugging.' },
  { re: /No QueryClient set/,
    say: 'A React Query hook ran outside a provider. The lab wraps your component in a QueryClientProvider already, so this usually means the hook is being called from a module-level function rather than a component.' }
];

function explainError(message) {
  const text = String(message || '');
  for (let i = 0; i < ERROR_COACHING.length; i++) {
    if (ERROR_COACHING[i].re.test(text)) return ERROR_COACHING[i].say;
  }
  return null;
}

class PreviewBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err: err }; }
  componentDidCatch(err) { this.props.onError(err); }
  componentDidUpdate(prev) {
    if (prev.resetKey !== this.props.resetKey && this.state.err) this.setState({ err: null });
  }
  render() {
    if (this.state.err) {
      const message = String(this.state.err.message || this.state.err);
      const coaching = explainError(message);
      return (
        <div className="rounded-lg border border-fail/40 bg-fail/[0.07] p-3">
          <div className="font-mono text-[10px] uppercase tracking-[0.18em] text-fail">runtime error</div>
          <p className="mt-1.5 font-mono text-[12px] leading-relaxed text-fail/90">{message}</p>
          {coaching ? (
            <p className="mt-2.5 border-l-2 border-lamp/50 pl-2.5 text-[12.5px] leading-relaxed text-lamp/90">{coaching}</p>
          ) : null}
        </div>
      );
    }
    return this.props.children;
  }
}

/* Monaco: the editor VS Code is built on. Autocomplete, hover docs, signature
   help, bracket pairs, multi-cursor, F1 command palette. */
function MonacoEditor(props) {
  const hostRef = useRef(null);
  const editorRef = useRef(null);
  const latest = useRef(props);
  latest.current = props;

  useEffect(function () {
    const monaco = window.monaco;
    const editor = monaco.editor.create(hostRef.current, {
      value: latest.current.value,
      language: 'javascript',
      theme: 'ocr-lab',
      fontFamily: '"IBM Plex Mono", ui-monospace, Consolas, monospace',
      fontSize: 12.5,
      lineHeight: 20,
      tabSize: 2,
      insertSpaces: true,
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      automaticLayout: false,
      wordWrap: 'off',
      renderLineHighlight: 'line',
      smoothScrolling: true,
      cursorBlinking: 'phase',
      padding: { top: 10, bottom: 10 },
      scrollbar: { verticalScrollbarSize: 10, horizontalScrollbarSize: 10 },
      suggestOnTriggerCharacters: true,
      quickSuggestions: { other: true, comments: false, strings: false },
      acceptSuggestionOnEnter: 'on',       // as VS Code does it; Tab accepts too
      tabCompletion: 'on',
      snippetSuggestions: 'top',
      parameterHints: { enabled: true },
      bracketPairColorization: { enabled: true },
      autoClosingBrackets: 'languageDefined',
      autoClosingQuotes: 'languageDefined',
      formatOnPaste: true,
      fixedOverflowWidgets: true
    });
    editorRef.current = editor;
    latest.current.onReady({
      kind: 'monaco',
      insert: function (body) {
        const controller = editor.getContribution('snippetController2');
        if (controller) controller.insert(body.join('\n'));
        else editor.trigger('lab', 'type', { text: plainSnippet(body) });
        editor.focus();
      },
      focus: function () { editor.focus(); }
    });

    const changeSub = editor.onDidChangeModelContent(function () {
      const next = editor.getValue();
      if (next !== latest.current.value) latest.current.onChange(next);
    });
    const cursorSub = editor.onDidChangeCursorPosition(function (e) {
      latest.current.onCursor(e.position.lineNumber, e.position.column);
    });

    let observer = null;
    if (typeof ResizeObserver !== 'undefined') {
      observer = new ResizeObserver(function () { editor.layout(); });
      observer.observe(hostRef.current);
    }
    const onResize = function () { editor.layout(); };
    window.addEventListener('resize', onResize);
    /* The pane is flex-sized, so measure again once the browser has laid it out. */
    window.requestAnimationFrame(function () { if (editorRef.current) editor.layout(); });

    return function () {
      window.removeEventListener('resize', onResize);
      if (observer) observer.disconnect();
      changeSub.dispose();
      cursorSub.dispose();
      editor.dispose();
      editorRef.current = null;
      latest.current.onReady(null);
    };
  }, []);

  /* Exercise switched, reset, or solution revealed: replace the buffer. */
  useEffect(function () {
    const editor = editorRef.current;
    if (editor && editor.getValue() !== props.value) editor.setValue(props.value);
  }, [props.value]);

  return <div ref={hostRef} className="h-full w-full overflow-hidden rounded-lg border border-rule" />;
}

/* Always available, and what the lab uses if Monaco cannot load. */
const CLOSERS = { '(': ')', '[': ']', '{': '}', "'": "'", '"': '"' };

function PlainEditor(props) {
  const taRef = useRef(null);
  const gutterRef = useRef(null);
  const latest = useRef(props);
  latest.current = props;
  const lines = props.value.split('\n').length;

  /* Replace the selection and put the caret where you asked. */
  function apply(start, end, inserted, caret) {
    const value = latest.current.value;
    latest.current.onChange(value.slice(0, start) + inserted + value.slice(end));
    requestAnimationFrame(function () {
      const ta = taRef.current;
      if (!ta) return;
      ta.selectionStart = ta.selectionEnd = caret;
      reportCursor();
    });
  }

  function reportCursor() {
    const ta = taRef.current;
    if (!ta || !latest.current.onCursor) return;
    const upto = latest.current.value.slice(0, ta.selectionStart).split('\n');
    latest.current.onCursor(upto.length, upto[upto.length - 1].length + 1);
  }

  useEffect(function () {
    latest.current.onReady({
      kind: 'plain',
      insert: function (body) {
        const ta = taRef.current;
        const text = plainSnippet(body);
        const start = ta.selectionStart;
        apply(start, ta.selectionEnd, text, start + text.length);
        ta.focus();
      },
      focus: function () { if (taRef.current) taRef.current.focus(); }
    });
    return function () { latest.current.onReady(null); };
  }, []);

  function onKeyDown(e) {
    const ta = taRef.current;
    const value = latest.current.value;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;

    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      latest.current.onRun();
      return;
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      apply(start, end, '  ', start + 2);
      return;
    }

    /* Keep the indent of the current line, and open a block when the caret sits
       between a brace pair. */
    if (e.key === 'Enter') {
      const lineStart = value.lastIndexOf('\n', start - 1) + 1;
      const indent = (value.slice(lineStart, start).match(/^[ \t]*/) || [''])[0];
      const before = value[start - 1];
      const after = value[start];
      const opensBlock = before === '{' || before === '[' || before === '(';
      const insideBlock = opensBlock && CLOSERS[before] === after;

      if (insideBlock) {
        e.preventDefault();
        apply(start, end, '\n' + indent + '  \n' + indent, start + 1 + indent.length + 2);
        return;
      }
      if (opensBlock || indent) {
        e.preventDefault();
        const pad = indent + (opensBlock ? '  ' : '');
        apply(start, end, '\n' + pad, start + 1 + pad.length);
        return;
      }
    }

    /* Auto-close, and wrap the selection when there is one. */
    if (CLOSERS[e.key]) {
      e.preventDefault();
      const close = CLOSERS[e.key];
      if (start !== end) {
        apply(start, end, e.key + value.slice(start, end) + close, end + 2);
      } else {
        apply(start, end, e.key + close, start + 1);
      }
      return;
    }

    /* Type over the closer we inserted rather than doubling it. */
    if ((e.key === ')' || e.key === ']' || e.key === '}' || e.key === "'" || e.key === '"') &&
        start === end && value[start] === e.key) {
      e.preventDefault();
      ta.selectionStart = ta.selectionEnd = start + 1;
      reportCursor();
      return;
    }

    /* Backspace between a fresh pair removes both halves. */
    if (e.key === 'Backspace' && start === end && start > 0 &&
        CLOSERS[value[start - 1]] === value[start]) {
      e.preventDefault();
      apply(start - 1, start + 1, '', start - 1);
    }
  }

  function syncScroll() {
    if (gutterRef.current && taRef.current) gutterRef.current.scrollTop = taRef.current.scrollTop;
  }

  const numbers = [];
  for (let i = 1; i <= lines; i++) numbers.push(i);

  return (
    <div className="flex min-h-0 flex-1 overflow-hidden rounded-lg border border-rule bg-bed">
      <div
        ref={gutterRef}
        aria-hidden="true"
        className="code-metrics select-none overflow-hidden border-r border-rule bg-bed2/60 px-2 py-3 text-right text-graphite/50"
      >
        {numbers.map(function (n) { return <div key={n}>{n}</div>; })}
      </div>
      <textarea
        ref={taRef}
        value={props.value}
        onChange={function (e) { props.onChange(e.target.value); }}
        onKeyDown={onKeyDown}
        onKeyUp={reportCursor}
        onClick={reportCursor}
        onScroll={syncScroll}
        spellCheck={false}
        wrap="off"
        autoComplete="off"
        autoCorrect="off"
        autoCapitalize="off"
        aria-label="Exercise code editor"
        className="editor code-metrics min-h-0 min-w-0 flex-1 bg-transparent px-3 py-3 text-paper outline-none"
      />
    </div>
  );
}

function subscribeMonaco(listener) {
  monacoState.listeners.add(listener);
  return function () { monacoState.listeners.delete(listener); };
}
function readMonacoStatus() { return monacoState.status; }

/* Starts the Monaco download on first mount, renders the plain editor until it
   is ready, and stays on the plain editor forever if it never arrives. */
function Editor(props) {
  const status = useSyncExternalStore(subscribeMonaco, readMonacoStatus);

  useEffect(function () { loadMonaco(); }, []);

  return status === 'ready' ? <MonacoEditor {...props} /> : <PlainEditor {...props} />;
}

const activeEditor = { current: null };

function GuideStep(props) {

  const [open, setOpen] = useState(false);

              <button
                onClick={function () { setOpen(!open); }}
                aria-expanded={shown}
                className="shrink-0 rounded border border-rule px-1.5 py-0.5 font-mono text-[9.5px] uppercase tracking-[0.1em] text-graphite transition-colors hover:border-lamp/40 hover:text-lamp"

                <button
                  onClick={function () {

                >insert</button>

function Guide(props) {
  const steps = props.steps;
  if (!steps || steps.length === 0) return null;

  return (
    <div>
      <div className="mb-2 flex items-center justify-between gap-2">
        <p className="text-[12.5px] text-graphite">

function CheckList(props) {

  return (

      <div className="flex items-center justify-between border-b border-rule/70 px-3 py-2">
        <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-graphite">checks</span>

        </span>

        {results.map(function (r, i) {
          return (
            <li key={i} className="px-3 py-2">

                    <p className="mt-1 border-l-2 border-lamp/40 pl-2 text-[12px] leading-relaxed text-lamp/90">{r.hint}</p>
                  ) : null}

/* ---- Preview ------------------------------------------------------------- */

function Preview(props) {
  const Component = props.component;
  const queryClient = useMemo(function () {
    return new QueryClient({
      defaultOptions: { queries: { retry: 0, staleTime: 0, refetchOnWindowFocus: false } }
    });
  }, [props.runToken]);

  useEffect(function () {
    return function () { queryClient.clear(); };
  }, [queryClient]);

  useSyncExternalStore(Runtime.subscribe, Runtime.getSnapshot);

  return (
    <div className="relative min-h-[140px] overflow-hidden rounded-lg border border-rule bg-bed p-4 grain">
      {props.sweeping ? <div key={'sweep-' + props.runToken} className="scan-sweep" /> : null}

        <div className="mb-3 rounded-lg border border-fail/50 bg-fail/[0.08] p-3">
          <div className="font-mono text-[10px] uppercase tracking-[0.18em] text-fail">preview halted</div>

        </div>
      ) : Component ? (
        <PreviewBoundary key={props.runToken} resetKey={props.runToken} onError={props.onRenderError}>
          <QueryClientProvider client={queryClient}>
            <Component />
          </QueryClientProvider>
        </PreviewBoundary>
      ) : (
        <div className="flex h-[110px] flex-col items-center justify-center gap-2 text-center">
          <div className="font-mono text-[10px] uppercase tracking-[0.22em] text-graphite/60">preview idle</div>

      <div className="flex shrink-0 items-center gap-3 px-0.5 font-mono text-[10px] text-graphite/70">
        <span>{'Ln ' + cursor.line + ', Col ' + cursor.col}</span>
        <span className="text-rule">|</span>
        <span>javascript · jsx</span>
        <span className="text-rule">|</span>
        <span>ctrl+space suggestions</span>
        <span className="ml-auto flex items-center gap-1.5" title={mode.title}>
          <span className={mode.tone}>●</span>
          <span className={mode.tone}>{mode.text}</span>
        </span>
      </div>

      <div className="flex min-h-0 flex-[1_1_58%] flex-col gap-3 overflow-y-auto pr-0.5">
        <CheckList results={props.results} />
        <Preview
          component={props.run ? props.run.component : null}
          compileError={props.run ? props.run.compileError : null}
          runToken={props.run ? props.run.token : 0}
          sweeping={props.sweeping}
          onRenderError={props.onRenderError}
        />
        <SandboxLog />
      </div>
    </div>
  );
}

/* ---- Root ---------------------------------------------------------------- */

function Root() {
  const saved = useMemo(loadProgress, []);
  const [index, setIndex] = useState(Math.min(saved.index || 0, LESSONS.length - 1));
  const [exIndex, setExIndex] = useState(0);
  const [codeMap, setCodeMap] = useState(saved.codeMap || {});
  const [attempted, setAttempted] = useState(saved.attempted || {});
  const [doneEx, setDoneEx] = useState(saved.doneEx || {});
  const [solutionFor, setSolutionFor] = useState(null);
  const [stash, setStash] = useState('');
  const [run, setRun] = useState(null);
  const [renderError, setRenderError] = useState(null);
  const [sweeping, setSweeping] = useState(false);
  const [revealAll, setRevealAll] = useState(!!saved.revealAll);

  const halted = useSyncExternalStore(Runtime.subscribe, function () { return Runtime.halted; });

  const lesson = LESSONS[index];
  const exercise = lesson.exercises[exIndex] || lesson.exercises[0] || null;
  const solutionShown = !!(exercise && solutionFor === exercise.id);

  const code = !exercise ? ''
    : solutionShown ? stash
    : (codeMap[exercise.id] !== undefined ? codeMap[exercise.id] : exercise.starter);

  /* --- run ---------------------------------------------------------------- */
  const doRun = useCallback(function () {
    if (!exercise) return;
    Runtime.clear();
    setRenderError(null);
    setAttempted(function (a) {
      if (a[exercise.id]) return a;
      const next = Object.assign({}, a); next[exercise.id] = true; return next;
    });

    let component = null;
    let compileError = null;
    try { component = compile(code); }
    catch (err) { compileError = err.message; }

    setRun({ exId: exercise.id, code: code, component: component, compileError: compileError, token: Date.now() });
    setSweeping(true);
    window.setTimeout(function () { setSweeping(false); }, 700);
  }, [exercise, code]);

  const results = useMemo(function () {
    if (!run || !exercise || run.exId !== exercise.id) return null;
    const renderOk = !run.compileError && !renderError && !halted;
    return runChecks(exercise, run.code, renderOk);
  }, [run, exercise, renderError, halted]);

  /* --- completion --------------------------------------------------------- */
  useEffect(function () {
    if (!results || !exercise || solutionShown) return;   // reading the answer is not solving it
    const all = results.every(function (r) { return r.passed; });
    if (!all) return;
    setDoneEx(function (d) {
      if (d[exercise.id]) return d;
      const next = Object.assign({}, d); next[exercise.id] = true; return next;
    });
  }, [results, exercise, solutionShown]);

  useEffect(function () {
    if (lesson.readonly) {
      setDoneEx(function (d) {
        if (d[lesson.id]) return d;
        const next = Object.assign({}, d); next[lesson.id] = true; return next;
      });
    }
  }, [lesson]);

  const doneMap = useMemo(function () {
    const map = {};
    LESSONS.forEach(function (l) {
      map[l.id] = l.readonly
        ? !!doneEx[l.id]
        : l.exercises.length > 0 && l.exercises.every(function (e) { return !!doneEx[e.id]; });
    });
    return map;
  }, [doneEx]);

  const doneCount = LESSONS.filter(function (l) { return doneMap[l.id]; }).length;

  /* --- persistence -------------------------------------------------------- */
  useEffect(function () {
    saveProgress({ index: index, codeMap: codeMap, attempted: attempted, doneEx: doneEx, revealAll: revealAll });
  }, [index, codeMap, attempted, doneEx, revealAll]);

  /* --- navigation --------------------------------------------------------- */
  function goToLesson(i) {
    setIndex(i);
    setExIndex(0);
    setRun(null);
    setRenderError(null);
    setSolutionFor(null);
    Runtime.clear();
  }
  function pickExercise(i) {
    setExIndex(i);
    setRun(null);
    setRenderError(null);
    setSolutionFor(null);
    Runtime.clear();
  }

  function onChangeCode(next) {
    if (!exercise) return;
    if (solutionShown) { setStash(next); return; }
    setCodeMap(function (m) {
      const copy = Object.assign({}, m); copy[exercise.id] = next; return copy;
    });
  }

  function onReset() {
    if (!exercise) return;
    setSolutionFor(null);
    setCodeMap(function (m) {
      const copy = Object.assign({}, m); copy[exercise.id] = exercise.starter; return copy;
    });
    setRun(null);
    Runtime.clear();
  }

  function onToggleSolution() {
    if (!exercise) return;
    if (solutionShown) { setSolutionFor(null); setStash(''); }
    else { setStash(exercise.solution); setSolutionFor(exercise.id); }
    setRun(null);
    Runtime.clear();
  }

  /* --- global shortcut ---------------------------------------------------- */
  useEffect(function () {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); doRun(); }
    }
    window.addEventListener('keydown', onKey);
    return function () { window.removeEventListener('keydown', onKey); };
  }, [doRun]);

  return (
    <div className="flex h-full flex-col bg-ink">
      <Header index={index} doneMap={doneMap} onPick={goToLesson} />

      <main className="grid flex-1 grid-cols-1 overflow-y-auto lg:min-h-0 lg:grid-cols-[minmax(340px,38%)_1fr] lg:overflow-hidden">
        <div className="border-b border-rule bg-bed grain lg:min-h-0 lg:border-b-0 lg:border-r">
          <LessonPanel
            lesson={lesson}
            exercise={exercise}
            index={index}
            doneEx={doneEx}
            doneCount={doneCount}
            revealAll={revealAll}
            onToggleReveal={setRevealAll}
            onPickExercise={pickExercise}
            onPrev={function () { goToLesson(Math.max(0, index - 1)); }}
            onNext={function () { goToLesson(Math.min(LESSONS.length - 1, index + 1)); }}
          />
        </div>

        <div className="flex flex-col bg-ink lg:min-h-0">
          <Workbench
            lesson={lesson}
            exercise={exercise}
            code={code}
            results={results}
            run={run}
            sweeping={sweeping}
            attempted={!!(exercise && attempted[exercise.id])}
            solutionShown={solutionShown}
            onChange={onChangeCode}
            onRun={doRun}
            onReset={onReset}
            onToggleSolution={onToggleSolution}
            onRenderError={function (err) { setRenderError(err); }}
          />
        </div>
      </main>
    </div>
  );
}

window.__lab = { Runtime: Runtime, mockApi: mockApi, apiConfig: apiConfig, LESSONS: LESSONS, compile: compile };

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>

<script>
  /* Classic script, so it runs even if the browser refuses to execute module
     scripts at all (which some do for pages opened straight off the disk). */
  var HOW_TO_SERVE =
    'The libraries load from esm.sh and the fonts from Google Fonts, so the first load needs a\n' +
    'network connection. After that the browser cache covers you.\n\n' +
    'If you opened this file directly and the browser blocked the module imports, serve the\n' +
    'folder instead and open the printed URL:\n\n' +
    '    npx serve .            (or)   python -m http.server 8000\n';

  window.__labFatal = function (title, detail) {
    var root = document.getElementById('root');
    var fatal = document.getElementById('fatal');
    if (root) root.innerHTML = '';
    fatal.hidden = false;
    fatal.style.whiteSpace = 'pre-wrap';
    fatal.textContent = title + '\n\n' + detail;
  };

  window.__labBootTimer = setTimeout(function () {
    if (window.__lab) return;                                  // already running
    if (!document.getElementById('fatal').hidden) return;       // already reported
    window.__labFatal('The lab did not start within 9 seconds.', HOW_TO_SERVE);
  }, 9000);
</script>

<script type="module">
  const die = (title, detail) => window.__labFatal(title, detail);

  try {
    const mods = await Promise.all([
      import('react'),
      import('react-dom/client'),
      import('zustand'),
      import('zustand/react/shallow'),
      import('@tanstack/react-query'),
      import('@babel/standalone')
    ]);

    const React     = mods[0].default || mods[0];
    const ReactDOM  = mods[1];
    const create    = mods[2].create || (mods[2].default && mods[2].default.create);
    const useShallow = mods[3].useShallow;
    const RQ        = mods[4];
    const Babel     = mods[5].default || mods[5];

    if (!React || !React.useState) throw new Error('React failed to load from the CDN.');
    if (!Babel || !Babel.transform) throw new Error('Babel standalone failed to load from the CDN.');
    if (typeof create !== 'function') throw new Error('zustand failed to load from the CDN.');

    const source = document.getElementById('app-src').textContent;
    const compiled = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]],
      filename: 'lab.jsx'
    }).code;

    const factory = new Function('React', 'ReactDOM', 'create', 'useShallow', 'RQ', 'Babel', compiled);
    factory(React, ReactDOM, create, useShallow, RQ, Babel);
    clearTimeout(window.__labBootTimer);

    window.addEventListener('error', function (e) {
      if (window.__lab) window.__lab.Runtime.log('fail', 'uncaught: ' + (e.message || e.error));
    });
    window.addEventListener('unhandledrejection', function (e) {
      const reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
      if (window.__lab && reason.indexOf('Halted') === -1) {
        window.__lab.Runtime.log('fail', 'unhandled rejection: ' + reason);
      }
      e.preventDefault();
    });
  } catch (err) {
    clearTimeout(window.__labBootTimer);
    die('The lab could not start: ' + (err && err.message ? err.message : String(err)), HOW_TO_SERVE);
  }
</script>
</body>
</html>
